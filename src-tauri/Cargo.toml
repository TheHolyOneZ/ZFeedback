[package]
name = "zfeedback"
version = "0.1.0"
description = "Browse every Z tool and file bug reports, feature requests and app requests — with a reply from a human, not a black hole."
authors = ["TheHolyOneZ"]
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/TheHolyOneZ/ZFeedback"
homepage = "https://zsync.eu"
readme = "../README.md"
keywords = ["tauri", "feedback", "bug-tracker", "desktop", "privacy"]
categories = ["gui"]
# An application, not a library — nothing here belongs on crates.io.
publish = false

[lib]
# The `_lib` suffix is required so the lib name does not collide with the bin
# name on Windows. See rust-lang/cargo#8519.
name = "zfeedback_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

# All HTTP happens here rather than in the webview. That keeps the bearer token
# out of JavaScript entirely and makes CORS irrelevant.
# rustls rather than native-tls: one less system dependency to get wrong across
# Windows and the various Linux distros.
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
  "gzip",
  "charset",
  "http2",
] }

tokio = { version = "1", features = ["time", "rt", "sync", "macros"] }

# OS keychain for the API token: Credential Manager on Windows, Secret Service
# on Linux. A plaintext file would defeat the point of keeping the token out of
# the webview in the first place.
keyring = { version = "3", features = [
  "windows-native",
  "sync-secret-service",
  "crypto-rust",
] }

thiserror = "2"
base64 = "0.22"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
